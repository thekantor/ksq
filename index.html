<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Ксюшин квест</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&family=Caveat:wght@500;700&display=swap">
</head><body>
<style>
/* Зимняя ночь, одна тропа сверху вниз от дома до башни; тропа рисуется золотом по мере того, как открываются точки.
   Единая тёмная тема выбрана намеренно. */
:root{color-scheme:dark;
 --night:#0d1730;--night2:#152342;--night3:#1d2d52;--snow:#eef3fa;--frost:#9db3d4;--mut:#8ea2c4;
 --gold:#f1c04f;--gold-ink:#241a02;--ribbon:#de4b57;--line:#ffffff1f;
 --display:"Unbounded","Arial Black",system-ui,sans-serif;--body:"Manrope",system-ui,sans-serif;--hand:"Caveat","Segoe Print",cursive}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--snow)}
body{margin:0;font:16px/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
 background:radial-gradient(600px 380px at 85% -5%,#2a3f74 0,transparent 65%),radial-gradient(500px 360px at -10% 40%,#24305e 0,transparent 60%),var(--night)}
.wrap{max-width:980px;margin:0 auto;padding-block:26px 110px}
header.top{display:grid;gap:6px;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--frost);margin:0}
h1{font:700 clamp(26px,6.4vw,44px)/1.1 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--gold)}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut);margin-top:4px}
.prog .dots{display:flex;gap:5px}.prog .dots i{width:22px;height:5px;border-radius:9px;background:#ffffff1c}.prog .dots i.on{background:var(--gold)}
.layout{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
/* map */
.map{position:relative;background:linear-gradient(180deg,#14234466,#0d173000);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map .trail{fill:none;stroke:#9db3d455;stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round}
.map .done{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 6px #f1c04f88)}
.node{cursor:pointer;outline:none}
.node circle.ring{fill:var(--night2);stroke:#9db3d466;stroke-width:2}
.node.open circle.ring{fill:var(--gold);stroke:var(--gold)}
.node.cur circle.ring{stroke:#fff;stroke-width:3}
.node.sel circle.halo{opacity:1}
.node circle.halo{fill:none;stroke:var(--gold);stroke-width:2;opacity:0}
.node.cur circle.halo{opacity:.8;animation:pulse 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.node text.n{font:700 14px var(--display);fill:var(--frost);text-anchor:middle;dominant-baseline:central}
.node.open text.n{fill:var(--gold-ink)}
.node text.lbl{font:600 15px var(--body);fill:var(--snow)}
.node text.sub{font:500 12px var(--body);fill:var(--mut)}
.node.locked text.lbl{fill:var(--mut);letter-spacing:.2em}
.node:focus-visible circle.ring{stroke:#fff;stroke-width:3}
.flake{fill:#ffffff;opacity:.5}
/* card */
.card{grid-template-columns:minmax(0,1fr);background:var(--night2);border:1px solid var(--line);border-radius:22px;padding:20px 18px;display:grid;gap:14px;min-width:0}
.card .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--frost);margin:0}
.card h2{font:700 clamp(21px,4.6vw,28px)/1.18 var(--display);margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 11px;border-radius:99px;background:#ffffff10;border:1px solid var(--line);color:var(--snow)}
.chip.gold{background:#f1c04f1f;border-color:#f1c04f55;color:var(--gold)}
.lead{margin:0;font-size:16.5px}
.box{border-radius:14px;padding:12px 14px;background:var(--night3);display:grid;gap:3px}
.box b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--frost);font-weight:700}
.box.ribbon{background:linear-gradient(90deg,#de4b5726,#de4b570d);border:1px solid #de4b5744}
.box.ribbon b{color:#ff9aa2}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
a.btn,button.btn{font:600 14.5px var(--body);display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:#ffffff0d;color:var(--snow);text-decoration:none;cursor:pointer}
a.btn:hover,button.btn:hover{background:#ffffff18}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn.primary:hover{background:#ffd06a}
a.btn:focus-visible,button.btn:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hints{display:grid;gap:8px}
.hint{font-size:15px;padding:10px 14px;border-radius:12px;border:1px dashed #9db3d466;color:var(--snow)}
form.code{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding-top:6px;border-top:1px solid var(--line)}
form.code label{font-size:13px;color:var(--frost)}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;font:700 18px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:12px 14px;border-radius:12px;border:1px solid #9db3d466;background:var(--night);color:var(--snow)}
.row input::placeholder{color:#8ea2c477;letter-spacing:.02em;text-transform:none;font:500 16px var(--body)}
.msg{min-height:1.4em;font-size:14px;margin:0;color:var(--mut)}
.msg.err{color:#ff9aa2}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.okline{font-size:14px;color:var(--gold);margin:0}
/* letter */
.letter{background:#f6efe2;color:#2b2335;border-radius:6px;padding:22px 20px 18px;box-shadow:0 14px 40px #0008;transform:rotate(-.6deg);display:grid;gap:8px}
.letter p{margin:0;font:500 25px/1.25 var(--hand)}
.letter .sig{font:700 30px/1.1 var(--hand);color:var(--ribbon);margin-top:6px}
.contact{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--mut)}
.note{font-size:13px;color:var(--mut);margin:0}
/* phone: map becomes a horizontal strip above the card */
@media (max-width:819px){
 .wrap{padding-block:18px 110px}
 h1{font-size:clamp(23px,6.6vw,30px)}
 .layout{gap:14px}
 .map{border-radius:18px}
 .node text.lbl{font-size:11.5px}
 .node text.n{font-size:12px}
 .card{padding:18px 16px;border-radius:18px}
 .lead{font-size:16px}
 .row{flex-direction:column}
 .row .btn{justify-content:center;padding:13px}
 a.btn{width:100%;justify-content:center}
}
.help{margin:18px 0 0;font-size:14px;color:var(--mut)}
.tgbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:flex-end;
 padding:22px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
 background:linear-gradient(180deg,#0d173000,var(--night) 45%);pointer-events:none}
.tgbtn{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 16px var(--display);letter-spacing:.01em;
 color:#fff;text-decoration:none;padding:15px 26px;border-radius:999px;background:linear-gradient(135deg,#ff6b7a,var(--ribbon) 55%,#b8324a);
 box-shadow:0 10px 30px #de4b5766,inset 0 1px 0 #ffffff40}
.tgbtn svg{width:22px;height:22px;flex:none}
.tgbtn:hover{filter:brightness(1.08)}
.tgbtn:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (max-width:819px){.tgbar{justify-content:stretch}.tgbtn{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
 <header class="top">
  <p class="eyebrow">Квест для любимой</p>
  <h1>Ксюша, празднуем <em>твой день рождения</em></h1>
  <div class="prog"><span class="dots" id="dots"></span><span id="progtxt"></span></div>
 </header>
 <div class="layout">
  <div class="map" id="map" aria-label="Карта квеста"></div>
  <div id="card" class="card" aria-live="polite"></div>
 </div>
 <p class="help">Застряла? Открой подсказку на карточке или напиши Коле.</p>
</div>
<div class="tgbar" id="contact"></div>

var N=D.locked.length+1, stages=[D.first], codes=[], sel=0, KEY='ksq-map-v1';
var $=function(id){return document.getElementById(id)};
function norm(s){return s.toUpperCase().replace(/Ё/g,'Е').replace(/[^A-ZА-Я0-9]/g,'')}
function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function dec(p,code){
 var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(code)),'PBKDF2',false,['deriveKey']);
 var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(p.s),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(p.i)},key,u8(p.c));
 return JSON.parse(new TextDecoder().decode(pt));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(codes))}catch(e){}}

/* --- карта --- */
var MQ=window.matchMedia?matchMedia('(max-width:819px)'):{matches:false};
var W,H,R,STEP,TOP;function geo(){if(MQ.matches){W=360;H=104;R=15;STEP=(W-56)/(N-1)}else{W=360;STEP=118;TOP=62;R=19;H=TOP*2+STEP*(N-1)}}
function pos(i){return MQ.matches?{x:28+i*STEP,y:i%2?62:34}:{x:i%2?250:110,y:TOP+i*STEP}}
function path(n){var p0=pos(0),d='M'+p0.x+' '+p0.y;for(var i=1;i<n;i++){var a=pos(i-1),b=pos(i);
 if(MQ.matches){var mx=(a.x+b.x)/2;d+=' C'+mx+' '+a.y+' '+mx+' '+b.y+' '+b.x+' '+b.y}else{var m=(a.y+b.y)/2;d+=' C'+a.x+' '+m+' '+b.x+' '+m+' '+b.x+' '+b.y}}return d}
function flakes(){var s='',r=7;for(var i=0;i<(MQ.matches?12:34);i++){r=(r*9301+49297)%233280;var x=r/233280*W;r=(r*9301+49297)%233280;var y=r/233280*H;r=(r*9301+49297)%233280;s+='<circle class="flake" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(0.8+r/233280*1.6).toFixed(2)+'"/>'}return s}
function drawMap(){
 geo();var narrow=MQ.matches;
 var open=stages.length,cur=open-1,s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Тропа квеста: открыто '+open+' из '+N+'">'+flakes();
 s+='<path class="trail" d="'+path(N)+'"/>';
 if(open>1)s+='<path class="done" d="'+path(open)+'"/>';
 for(var i=0;i<N;i++){
  var p=pos(i),st=stages[i],isOpen=!!st,left=i%2===0;
  var lx=narrow?p.x:(left?p.x+30:p.x-30),anchor=narrow?'middle':(left?'start':'end'),ly=narrow?(i%2?p.y+31:p.y-24):p.y+5;
  var cls='node '+(isOpen?'open':'locked')+(i===cur?' cur':'')+(i===sel?' sel':'');
  s+='<g class="'+cls+'" data-i="'+i+'" tabindex="'+(isOpen?0:-1)+'" role="button" aria-label="'+(isOpen?esc(st.short):'Закрытая точка')+'">';
  s+='<circle class="halo" cx="'+p.x+'" cy="'+p.y+'" r="'+(R+2)+'"/><circle class="ring" cx="'+p.x+'" cy="'+p.y+'" r="'+R+'"/>';
  s+='<text class="n" x="'+p.x+'" y="'+p.y+'">'+(isOpen?(st.final?'♥':i):'?')+'</text>';
  s+='<text class="lbl" x="'+lx+'" y="'+ly+'" text-anchor="'+anchor+'">'+(isOpen?esc(st.short):(narrow?'':'• • •'))+'</text></g>';
 }
 $('map').innerHTML=s+'</svg>';
 [].forEach.call($('map').querySelectorAll('.node.open'),function(g){
  var go=function(){sel=+g.dataset.i;render()};
  g.addEventListener('click',go);g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
 });
 var dots='';for(var j=0;j<N;j++)dots+='<i class="'+(j<open?'on':'')+'"></i>';$('dots').innerHTML=dots;
 $('progtxt').textContent=stages[N-1]?'Квест пройден':'Открыто '+open+' из '+N;
}

/* --- карточка точки --- */
function drawCard(){
 var st=stages[sel],last=sel===stages.length-1,h='';
 if(st.final){
  h='<p class="k">Финал</p><h2>'+esc(st.title)+'</h2><div class="letter">'+st.letter.map(function(l){return '<p>'+esc(l)+'</p>'}).join('')+'<p class="sig">'+esc(st.sign)+' ♥</p></div>';
  $('card').innerHTML=h;return;
 }
 h+='<p class="k">'+(sel===0?'Старт':'Точка '+sel+' из '+(N-2))+'</p><h2>'+esc(st.title)+'</h2>';
 var chips='';if(st.leg)chips+='<span class="chip">'+esc(st.leg)+'</span>';
 if(chips)h+='<div class="meta">'+chips+'</div>';
 h+='<p class="lead">'+esc(st.text)+'</p>';
 if(st.addr)h+='<div class="btnrow"><a class="btn" href="'+esc(st.yaUrl||'https://yandex.ru/maps/?text='+encodeURIComponent(st.ya))+'" target="_blank" rel="noopener">Открыть в Яндекс Картах ↗</a></div><p class="note">'+esc(st.addr)+'</p>';
 h+='<div class="box ribbon"><b>Где искать</b><span>'+esc(st.where)+'</span></div>';
 if(st.inside)h+='<div class="box"><b>Что внутри</b><span>'+esc(st.inside)+'</span></div>';
 h+='<div class="box"><b>Задание</b><span>'+esc(st.task)+'</span></div>';
 if(last){
  h+='<div class="hints" id="hints"></div><div class="btnrow"><button class="btn" type="button" id="hintbtn">Подсказка</button></div>';
  h+='<form class="code" id="form" autocomplete="off"><label for="codein">'+esc(st.ask)+'</label><div class="row"><input id="codein" name="code" placeholder="Слово или фраза" autocapitalize="characters" spellcheck="false"><button class="btn primary" type="submit" id="go">Открыть</button></div><p class="msg" id="msg"></p></form>';
 } else h+='<p class="okline">✓ Слово найдено, следующая точка открыта</p>';
 $('card').innerHTML=h;
 if(!last)return;
 var shown=0;$('hintbtn').addEventListener('click',function(){
  if(shown<st.hints.length){var d=document.createElement('div');d.className='hint';d.textContent=st.hints[shown++];$('hints').appendChild(d)}
  if(shown>=st.hints.length){this.disabled=true;this.textContent='Подсказки закончились';this.style.opacity=.5}
 });
 $('form').addEventListener('submit',async function(e){
  e.preventDefault();var v=$('codein').value,msg=$('msg');
  if(!norm(v)){msg.className='msg err';msg.textContent='Впиши слово из записки.';return}
  if(!(window.crypto&&crypto.subtle)){msg.className='msg err';msg.textContent='Этот браузер не умеет открывать точки. Открой ссылку в Safari или Chrome.';return}
  $('go').disabled=true;msg.className='msg';msg.textContent='Проверяю…';
  try{var next=await dec(D.locked[stages.length-1],v);codes.push(v);save();stages.push(next);sel=stages.length-1;render();
   var c=$('card');if(c.scrollIntoView&&innerWidth<820)c.scrollIntoView({behavior:'smooth',block:'start'})}
  catch(err){$('go').disabled=false;msg.className='msg err';msg.textContent='Это не то слово. Проверь записку или открой подсказку.';var f=$('form');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}
 });
}
function render(){drawMap();drawCard()}

/* --- связь --- */
if(D.tg)$('contact').innerHTML='<a class="tgbtn" href="'+esc(D.tg)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 3.6 2.9 10.8c-1 .4-1 1.7.1 2l4.6 1.4 1.8 5.6c.3.8 1.3 1 1.9.4l2.6-2.5 4.9 3.6c.7.5 1.7.1 1.9-.7l3-15.3c.2-1-.8-1.8-1.7-1.4zM9.6 14.2l8.6-7.4-6.9 8.7-.3 3.1-1.4-4.4z" fill="currentColor"/></svg><span>Написать Коле</span></a>';
else $('contact').hidden=true;
if(MQ.addEventListener)MQ.addEventListener('change',function(){drawMap()});

/* --- восстановление прогресса --- */
(async function(){
 var saved=[];try{saved=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
 sel=0;render();
 for(var i=0;i<saved.length&&i<D.locked.length;i++){
  try{stages.push(await dec(D.locked[i],saved[i]));codes.push(saved[i])}catch(e){break}
 }
 sel=stages.length-1;render();
})();
})();
</script>
